name: 🔄 KataBump Auto Renew

on:
  workflow_dispatch:
  schedule:
    # 上游用 "4天周期门控 + 脚本剩余>1天跳过" 两个规则互相冲突，
    # 会在到期前错过窗口（例：到期 10-16，10-14 剩余2天跳过，下次 10-18 已过期2天 → 服务器被删）。
    # 改为每天两次（UTC 22:37 / 14:37 = 北京 06:37 / 22:37），错开高峰、交给脚本判断（剩余 <=1 天才续期），
    # 同一天还有第二次重试机会。公开仓库 Actions 分钟数不计量。
    - cron: "37 22 * * *"
    - cron: "37 14 * * *"

jobs:
  renew:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      ACCOUNTS: ${{ secrets.ACCOUNTS }}
      BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      CHAT_ID: ${{ secrets.TG_CHAT_ID }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2

      - name: 🔍 Get Chrome version
        id: get_version
        run: |
          CHROME_VERSION=$(chromium-browser --version 2>/dev/null | grep -oE '[0-9]+' | head -1)
          if [ -z "$CHROME_VERSION" ]; then
            CHROME_VERSION=$(google-chrome --version 2>/dev/null | grep -oE '[0-9]+' | head -1)
          fi
          : "${CHROME_VERSION:=136}"
          echo "Detected: $CHROME_VERSION"
          echo "CHROME_VERSION=$CHROME_VERSION" >> $GITHUB_ENV

      - name: 🖥️ Start Xvfb
        run: Xvfb :99 -ac &

      - name: ⏳ Random delay
        run: sleep $((RANDOM % 60))

      - name: 🚀 Run Renew
        env:
          DISPLAY: ':99'
          HEADLESS: 'false'
          CHROME_VERSION: ${{ env.CHROME_VERSION }}
        run: python renew_katabump.py

      - name: 📸 Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katabump-screenshots
          path: "error-*.png"
          retention-days: 7
          if-no-files-found: warn

      - name: ⏱️ Commit time.txt
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 心跳写入：并行/重试时 time.txt 易冲突，失败不拖垮整次续期
          for i in 1 2 3; do
            echo "$(date +'%Y-%m-%d %H:%M:%S')" > time.txt
            git add time.txt

            if git diff --cached --quiet; then
              echo "time.txt unchanged, skip"
              exit 0
            fi

            git commit -m "⏱️ $(date +'%Y-%m-%d %H:%M:%S')" || true

            if ! git pull --rebase origin main; then
              echo "rebase conflict on attempt $i, rewriting time.txt"
              echo "$(date +'%Y-%m-%d %H:%M:%S')" > time.txt
              git add time.txt
              if ! GIT_EDITOR=true git rebase --continue; then
                git rebase --abort || true
                git fetch origin main
                git reset --soft origin/main
                sleep $((i * 2))
                continue
              fi
            fi

            if git push origin HEAD:main; then
              echo "time.txt committed and pushed (attempt $i)"
              exit 0
            fi

            echo "push failed on attempt $i, soft-reset to origin/main and retry"
            git fetch origin main
            git reset --soft origin/main
            sleep $((i * 2))
          done

          echo "⚠️ warning: failed to commit time.txt after 3 attempts (renew result unaffected)"
          exit 0
